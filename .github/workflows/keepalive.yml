name: Keep HF Spaces Alive

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        space:
          - SPACE_1
          - SPACE_2
          - SPACE_3
    steps:
      - name: Ping ${{ matrix.space }}
        run: |
          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
          echo "Target: ${{ matrix.space }}"
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            https://huggingface.co/api/spaces/${{ secrets[matrix.space] }})
          echo "Status Code: $response"
          if [ "$response" -eq 200 ]; then
            echo "Result: OK - Space is alive"
          elif [ "$response" -eq 403 ]; then
            echo "Result: FAILED - Token invalid or no permission"
            exit 1
          elif [ "$response" -eq 404 ]; then
            echo "Result: FAILED - Space not found, check secret value"
            exit 1
          else
            echo "Result: FAILED - Unexpected status $response"
            exit 1
          fi

name: Back4App Auto Redeploy

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run redeploy
        env:
          BACK4APP_COOKIE: ${{ secrets.BACK4APP_COOKIE }}
        run: python back4app_redeploy.py

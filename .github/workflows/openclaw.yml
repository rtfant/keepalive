name: Keep HF Spaces Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        space:
          - { id: qetuoasd/openclaw0312, name: openclaw0312 }
          # - { id: username/another-space, name: another-space }
    steps:
      - name: Ping ${{ matrix.space.name }}
        run: |
          echo "=== $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
          URL="https://${{ replace(matrix.space.id, '/', '-') }}.hf.space/__openclaw__/health"
          echo "Target: $URL"

          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            --connect-timeout 15 \
            --max-time 60 \
            "$URL" || echo "curl_failed")

          echo "Status Code: $response"

          if [ "$response" = "200" ] || [ "$response" = "401" ] || [ "$response" = "404" ]; then
            echo "Result: OK - Space is running"
          elif [ "$response" = "curl_failed" ]; then
            echo "Result: WARN - curl failed (maybe sleeping/starting up)"
          elif [ "$response" = "503" ] || [ "$response" = "502" ]; then
            echo "Result: WARN - Space is starting up (503/502)"
          else
            echo "Result: UNKNOWN - Status $response"
            exit 1
          fi
